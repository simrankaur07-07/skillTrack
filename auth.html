
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillTrack | Login & Sign Up</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #101b3f, #344f9c);
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
}

.logo {
    text-align: center;
    color: #3454a4;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.tabs {
    display: flex;
    background: #eef1f8;
    border-radius: 8px;
    padding: 5px;
    margin-bottom: 25px;
}

.tabs button {
    width: 50%;
    padding: 11px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    background: transparent;
    font-size: 15px;
}

.tabs button.active {
    background: #3454a4;
    color: white;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

h2 {
    margin-bottom: 20px;
    color: #222;
}

label {
    display: block;
    margin: 13px 0 7px;
    color: #444;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #3454a4;
}

.submit-btn {
    width: 100%;
    padding: 13px;
    margin-top: 22px;
    background: #3454a4;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    cursor: pointer;
}

.submit-btn:hover {
    background: #243c7c;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    color: #3454a4;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #3454a4;
    text-decoration: none;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">SkillTrack</div>
    <p class="subtitle">Learn Skills. Build Your Future.</p>

    <div class="tabs">
        <button id="loginTab" class="active"
        onclick="showForm('login')">Login</button>

        <button id="signupTab"
        onclick="showForm('signup')">Sign Up</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form active">

        <h2>Welcome Back!</h2>

        <label>Email Address</label>
        <input type="email" id="loginEmail"
        placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="loginPassword"
        placeholder="Enter your password" required>

        <button type="submit" class="submit-btn">
            Login
        </button>

        <p class="message" id="loginMessage"></p>

    </form>

    <!-- SIGN UP FORM -->
    <form id="signupForm" class="form">

        <h2>Create Account</h2>

        <label>Full Name</label>
        <input type="text" id="signupName"
        placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" id="signupEmail"
        placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="signupPassword"
        placeholder="Create a password" minlength="6" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword"
        placeholder="Confirm your password" required>

        <button type="submit" class="submit-btn">
            Create Account
        </button>

        <p class="message" id="signupMessage"></p>

    </form>

    <a href="index.html" class="back">← Back to Home</a>

</div>

<script>

// Switch between Login and Sign Up
function showForm(type) {

    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");

    loginForm.classList.remove("active");
    signupForm.classList.remove("active");

    loginTab.classList.remove("active");
    signupTab.classList.remove("active");

    if (type === "login") {
        loginForm.classList.add("active");
        loginTab.classList.add("active");
    } else {
        signupForm.classList.add("active");
        signupTab.classList.add("active");
    }
}

// Sign Up
document.getElementById("signupForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("signupName").value;
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("signupMessage");

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match!";
        return;
    }

    let users = JSON.parse(localStorage.getItem("skilltrackUsers")) || [];

    const existingUser = users.find(user => user.email === email);

    if (existingUser) {
        message.textContent = "This email is already registered!";
        return;
    }

    users.push({
        name: name,
        email: email,
        password: password
    });

    localStorage.setItem("skilltrackUsers", JSON.stringify(users));

    message.textContent = "Account created successfully! Please login.";

    document.getElementById("signupForm").reset();

});

// Login
document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    const message = document.getElementById("loginMessage");

    let users = JSON.parse(localStorage.getItem("skilltrackUsers")) || [];

    const user = users.find(
        user => user.email === email && user.password === password
    );

    if (user) {

        localStorage.setItem("skilltrackLoggedInUser", JSON.stringify({
            name: user.name,
            email: user.email
        }));

        message.textContent = "Login successful!";

        setTimeout(function() {
            window.location.href = "index.html";
        }, 1000);

    } else {
        message.textContent = "Invalid email or password!";
    }

});

</script>

</body>
</html>
