
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillTrack | Login & Sign Up</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #101b3f, #4968e8);
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
}

.logo {
    text-align: center;
    color: #3454a4;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.tabs {
    display: flex;
    background: #eef1f8;
    border-radius: 8px;
    padding: 5px;
    margin-bottom: 25px;
}

.tabs button {
    width: 50%;
    padding: 11px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    background: transparent;
    font-size: 15px;
}

.tabs button.active {
    background: #3454a4;
    color: white;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

h2 {
    margin-bottom: 20px;
    color: #222;
}

label {
    display: block;
    margin: 13px 0 7px;
    color: #444;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #3454a4;
}

.submit-btn {
    width: 100%;
    padding: 13px;
    margin-top: 22px;
    background: #3454a4;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    cursor: pointer;
}

.submit-btn:hover {
    background: #243c7c;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #3454a4;
    text-decoration: none;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">SkillTrack</div>
    <p class="subtitle">Learn Skills. Build Your Future.</p>

    <div class="tabs">
        <button type="button" id="loginTab"
        class="active" onclick="showForm('login')">
            Login
        </button>

        <button type="button" id="signupTab"
        onclick="showForm('signup')">
            Sign Up
        </button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form active">

        <h2>Welcome Back!</h2>

        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail"
        placeholder="Enter your email" required>

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword"
        placeholder="Enter your password" required>

        <button type="submit" class="submit-btn">
            Login
        </button>

        <p class="message" id="loginMessage"></p>

    </form>

    <!-- SIGN UP FORM -->
    <form id="signupForm" class="form">

        <h2>Create Account</h2>

        <label for="signupName">Full Name</label>
        <input type="text" id="signupName"
        placeholder="Enter your full name" required>

        <label for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail"
        placeholder="Enter your email" required>

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword"
        placeholder="Create a password"
        minlength="6" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
        placeholder="Confirm your password" required>

        <button type="submit" class="submit-btn">
            Create Account
        </button>

        <p class="message" id="signupMessage"></p>

    </form>

    <a href="index.html" class="back">← Back to Home</a>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

// YOUR FIREBASE CONFIGURATION
const firebaseConfig = {
    apiKey: "AIzaSyCxNJ2Fl_XAb0eMiX4KJv6uJaevrLofB-s",
    authDomain: "skilltrack-890ee.firebaseapp.com",
    projectId: "skilltrack-890ee",
    storageBucket: "skilltrack-890ee.firebasestorage.app",
    messagingSenderId: "964371909766",
    appId: "1:964371909766:web:d2587a16448c86baae9507",
    measurementId: "G-4X4JKDS42K"
};

// INITIALIZE FIREBASE
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// SWITCH LOGIN AND SIGNUP
window.showForm = function(type) {

    document.getElementById("loginForm")
    .classList.toggle("active", type === "login");

    document.getElementById("signupForm")
    .classList.toggle("active", type === "signup");

    document.getElementById("loginTab")
    .classList.toggle("active", type === "login");

    document.getElementById("signupTab")
    .classList.toggle("active", type === "signup");

};

// SIGN UP FUNCTION
document.getElementById("signupForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("signupMessage");

    message.style.color = "red";

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match!";
        return;
    }

    try {

        const result = await createUserWithEmailAndPassword(
            auth, email, password
        );

        await updateProfile(result.user, {
            displayName: name
        });

        message.style.color = "green";
        message.textContent = "Account created successfully!";

        document.getElementById("signupForm").reset();

    } catch (error) {

        message.textContent = error.message;

    }

});

// LOGIN FUNCTION
document.getElementById("loginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    const message = document.getElementById("loginMessage");

    message.style.color = "red";

    try {

        await signInWithEmailAndPassword(
            auth, email, password
        );

        message.style.color = "green";
        message.textContent = "Login successful!";

        setTimeout(function() {
            window.location.href = "index.html";
        }, 1000);

    } catch (error) {

        message.textContent = error.message;

    }

});

</script>

</body>
</html>
