
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillTrack Enrollment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 9px 0 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>SkillTrack Enrollment</h1>
    <p>Fill in the form to enroll in your favourite course.</p>

    <form id="enrollmentForm">

        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email Address</label>
        <input type="email" name="email" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" required>

        <label>Select Course</label>
        <select name="course" required>
            <option value="">Choose a course</option>
            <option>HTML & CSS</option>
            <option>JavaScript</option>
            <option>C Programming</option>
            <option>C++ Programming</option>
            <option>Python</option>
        </select>

        <label>Learning Level</label>
        <select name="level" required>
            <option value="">Choose your level</option>
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Advanced</option>
        </select>

        <label>Why do you want to join?</label>
        <textarea name="reason" rows="4" required></textarea>

        <button type="submit" id="submitBtn">Submit Enrollment</button>

    </form>

    <p id="message"></p>
</div>

<script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW
    const scriptURL = "https://script.google.com/macros/s/AKfycbx8eb51g4Kw7n5cppxfs9KZpJ4rRrX4ZHuvGybMMNuTM5VTMqeG_sBPNuV8VheAU5Kg/exec";

    const form = document.getElementById("enrollmentForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        if (scriptURL === "PASTE_YOUR_WEB_APP_URL_HERE") {
            message.textContent = "Please add your Apps Script URL first.";
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";
        message.textContent = "";

        try {
            const formData = new FormData(form);
            const data = new URLSearchParams();

            for (const [key, value] of formData.entries()) {
                data.append(key, value);
            }

            await fetch(scriptURL, {
                method: "POST",
                body: data,
                mode: "no-cors"
            });

            message.textContent =
                "Your request was sent. Check your Google Sheet to confirm it was saved.";

            message.style.color = "green";
            form.reset();

        } catch (error) {
            message.textContent = "Submission failed. Please try again.";
            message.style.color = "red";
            console.error(error);
        }

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Enrollment";
    });
</script>

</body>
</html>
